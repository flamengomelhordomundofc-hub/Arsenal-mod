name: Compilar Arsenal 3D v2.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compilar Mod v2.0 (.jar)
        run: bash compilar_arsenal_v2.sh
      - name: Baixar .jar v2.0 pronto
        uses: actions/upload-artifact@v4
        with:
          name: arsenalmod-v2.0-1.20.1-forge
          path: arsenalmod-2.0.0-forge-1.20.1.jar
